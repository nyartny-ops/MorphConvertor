name: Release

# Новый релиз: поменяй номер в файле VERSION и запушь в main —
# Actions соберёт Morph.dmg, поставит тег vX.Y.Z и опубликует релиз.
# Можно и тегом (git tag v1.2.0 && git push --tags) или вручную: Actions → Release → Run workflow.
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка Morph.dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(tr -d ' \n' < VERSION)"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      - name: Сборка Morph.app (universal ffmpeg)
        env:
          MORPH_VERSION: ${{ steps.v.outputs.version }}
        run: bash scripts/build.sh --out dist --ffmpeg universal

      - name: DMG и ZIP
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p stage
          cp -R dist/Morph.app stage/
          ln -s /Applications stage/Applications
          # постоянные имена — чтобы ссылка releases/latest/download/Morph.dmg всегда вела на свежую версию
          hdiutil create -volname "Morph $V" -srcfolder stage -ov -format UDZO "dist/Morph.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/Morph.app "dist/Morph.zip"
          cd dist && shasum -a 256 Morph.dmg Morph.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Morph-${{ steps.v.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Morph ${{ steps.v.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## Установка
            1. Скачай **Morph.dmg** (ниже, в Assets), открой и перетащи Morph в «Программы».
            2. Приложение не подписано сертификатом Apple, поэтому при первом запуске macOS его заблокирует. Один раз выполни в Терминале:
               ```
               xattr -dr com.apple.quarantine /Applications/Morph.app
               ```
               или открой «Системные настройки → Конфиденциальность и безопасность → Всё равно открыть».

            Внутри — ffmpeg для Apple Silicon и Intel. Для XLSX/PPTX нужен бесплатный [LibreOffice](https://www.libreoffice.org).
