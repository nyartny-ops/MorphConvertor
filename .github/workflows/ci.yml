name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Проверка кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC2086,SC2046,SC2015,SC2034 src/convert.sh scripts/build.sh install.command tests/engine.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Синтаксис JavaScript
        run: |
          node --check src/main.js
          node --check src/pdftool.js
          sed -n '/<script>/,/<\/script>/p' src/ui.html | sed '1d;$d' > /tmp/ui.js
          node --check /tmp/ui.js

  engine-linux:
    name: Движок (Linux, ffmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (статическая сборка — быстрее apt)
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo "$(ls -d /tmp/ffmpeg-*/bin)" >> "$GITHUB_PATH"
      - run: ffmpeg -version | head -1 && bash tests/engine.sh

  macos:
    name: Сборка и тесты (macOS)
    # macOS-машины GitHub часто в очереди — гоняем их только вручную и в pull request,
    # а на каждый push хватает Linux. Релиз собирается отдельным workflow.
    if: github.event_name != 'push'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg для тестов
        run: brew install ffmpeg
      - name: Тесты движка (включая sips, textutil, PDFKit)
        run: bash tests/engine.sh
      - name: Сборка Morph.app
        run: bash scripts/build.sh --out dist --ffmpeg auto
      - name: Проверка бандла
        run: |
          test -x dist/Morph.app/Contents/Resources/bin/ffmpeg
          test -f dist/Morph.app/Contents/Resources/ui.html
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Morph.app/Contents/Info.plist
          codesign --verify --deep --verbose=2 dist/Morph.app
